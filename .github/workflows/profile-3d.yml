name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#C9A961&color_dots=#1a140f,#3a2f1c,#6b5a33,#a88c4a,#C9A961&color_empty=#14110d&color_dot_border=#0A0A0A
            dist/github-snake.svg?color_snake=#8a6d2b&color_dots=#f0ece0,#e0d3b0,#cdb677,#b39650,#8a6d2b&color_empty=#f6f4ee

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
